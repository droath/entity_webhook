entity.outbound_endpoint.collection:
  path: '/admin/config/services/entity-webhook/broadcast/endpoints'
  defaults:
    _entity_list: 'outbound_endpoint'
    _title: 'Outbound Endpoints'
  requirements:
    _permission: 'administer entity_webhook_broadcast'

entity.outbound_endpoint.add_form:
  path: '/admin/config/services/entity-webhook/broadcast/endpoints/add'
  defaults:
    _entity_form: 'outbound_endpoint.add'
    _title: 'Add Outbound Endpoint'
  requirements:
    _permission: 'administer entity_webhook_broadcast'

entity.outbound_endpoint.edit_form:
  path: '/admin/config/services/entity-webhook/broadcast/endpoints/{outbound_endpoint}/edit'
  defaults:
    _entity_form: 'outbound_endpoint.edit'
    _title: 'Edit Outbound Endpoint'
  requirements:
    _permission: 'administer entity_webhook_broadcast'
  options:
    parameters:
      outbound_endpoint:
        type: entity:outbound_endpoint

entity.outbound_endpoint.delete_form:
  path: '/admin/config/services/entity-webhook/broadcast/endpoints/{outbound_endpoint}/delete'
  defaults:
    _entity_form: 'outbound_endpoint.delete'
    _title: 'Delete Outbound Endpoint'
  requirements:
    _permission: 'administer entity_webhook_broadcast'
  options:
    parameters:
      outbound_endpoint:
        type: entity:outbound_endpoint

entity.outbound_subscription.collection:
  path: '/admin/config/services/entity-webhook/broadcast/endpoints/{outbound_endpoint}/subscriptions'
