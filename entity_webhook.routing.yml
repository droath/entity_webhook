entity_webhook.receive:
  path: '/webhook/{endpoint_name}/{source_type}'
  defaults:
    _controller: '\Drupal\entity_webhook\Controller\WebhookController::receive'
  methods: [POST]
  requirements:
    _access: 'TRUE'

entity.webhook_endpoint.source_types:
  path: '/admin/config/services/entity-webhook/endpoints/{webhook_endpoint}/source-types'
  defaults:
    _controller: '\Drupal\entity_webhook\Controller\EndpointSourceTypesController::listSourceTypes'
    _title_callback: '\Drupal\entity_webhook\Controller\EndpointSourceTypesController::getTitle'
  requirements:
    _permission: 'administer entity_webhook'
  options:
    parameters:
      webhook_endpoint:
        type: entity:webhook_endpoint

entity.webhook_endpoint.source_types.add:
  path: '/admin/config/services/entity-webhook/endpoints/{webhook_endpoint}/source-types/add'
  defaults:
    _entity_form: 'webhook_source_type.add'
    _title: 'Add source type'
  requirements:
    _permission: 'administer entity_webhook'
  options:
    parameters:
      webhook_endpoint:
        type: entity:webhook_endpoint

entity.webhook_endpoint.source_types.remove:
  path: '/admin/config/services/entity-webhook/endpoints/{webhook_endpoint}/source-types/{source_type}/remove'
  defaults:
    _form: '\Drupal\entity_webhook\Form\EndpointSourceTypeRemoveForm'
    _title: 'Remove source type'
  requirements:
    _permission: 'administer entity_webhook'
  options:
    parameters:
      webhook_endpoint:
        type: entity:webhook_endpoint

entity.webhook_source_type.edit_form:
  path: '/admin/config/services/entity-webhook/endpoints/{webhook_endpoint}/source-types/{webhook_source_type}/edit'
  defaults:
    _entity_form: 'webhook_source_type.edit'
    _title: 'Edit source type'
  requirements:
    _entity_access: 'webhook_source_type.update'
  options:
    parameters:
      webhook_endpoint:
        type: entity:webhook_endpoint
      webhook_source_type:
        type: entity:webhook_source_type

entity.webhook_field_mapping.collection:
  path: '/admin/config/services/entity-webhook/endpoints/{webhook_endpoint}/source-types/{webhook_source_type}/field-mappings'
  defaults:
    _entity_list: 'webhook_field_mapping'
    _title: 'Field mappings'
  requirements:
    _permission: 'administer entity_webhook'
  options:
    parameters:
      webhook_endpoint:
        type: entity:webhook_endpoint
      webhook_source_type:
        type: entity:webhook_source_type

entity.webhook_field_mapping.add_form:
  path: '/admin/config/services/entity-webhook/endpoints/{webhook_endpoint}/source-types/{webhook_source_type}/field-mappings/add'
  defaults:
    _entity_form: 'webhook_field_mapping.add'
    _title: 'Add field mapping'
  requirements:
    _permission: 'administer entity_webhook'
  options:
    parameters:
      webhook_endpoint:
        type: entity:webhook_endpoint
      webhook_source_type:
        type: entity:webhook_source_type

entity.webhook_field_mapping.edit_form:
  path: '/admin/config/services/entity-webhook/endpoints/{webhook_endpoint}/source-types/{webhook_source_type}/field-mappings/{webhook_field_mapping}/edit'
  defaults:
    _entity_form: 'webhook_field_mapping.edit'
    _title: 'Edit field mapping'
  requirements:
    _permission: 'administer entity_webhook'
  options:
    parameters:
      webhook_endpoint:
        type: entity:webhook_endpoint
      webhook_source_type:
        type: entity:webhook_source_type
      webhook_field_mapping:
        type: entity:webhook_field_mapping

entity.webhook_field_mapping.delete_form:
  path: '/admin/config/services/entity-webhook/endpoints/{webhook_endpoint}/source-types/{webhook_source_type}/field-mappings/{webhook_field_mapping}/delete'
  defaults:
    _entity_form: 'webhook_field_mapping.delete'
    _title: 'Delete field mapping'
  requirements:
    _permission: 'administer entity_webhook'
  options:
    parameters:
      webhook_endpoint:
        type: entity:webhook_endpoint
      webhook_source_type:
        type: entity:webhook_source_type
      webhook_field_mapping:
        type: entity:webhook_field_mapping
